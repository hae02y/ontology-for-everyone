<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">질문에서 모델의 범위를 정하기</title><desc id="desc">취소된 주문의 배송 여부라는 업무 질문에서 필요한 대상, 관계, 자료, 답의 한계를 찾는 흐름</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="65" y="70" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#0f172a">모델보다 질문이 먼저입니다</text>
  <rect x="65" y="135" width="1070" height="92" rx="20" fill="#0f172a"/><text x="600" y="191" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="25" fill="#fff">“취소 요청된 주문에 이미 출고된 배송 건이 있습니까?”</text>
  <path d="M600 230V283" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><rect x="65" y="310" width="250" height="150" rx="18" fill="#dbeafe"/><rect x="340" y="310" width="250" height="150" rx="18" fill="#dcfce7"/><rect x="615" y="310" width="250" height="150" rx="18" fill="#fef3c7"/><rect x="890" y="310" width="245" height="150" rx="18" fill="#ede9fe"/>
  <text x="190" y="357" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" font-weight="700" fill="#1e40af">대상</text><text x="190" y="405" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="19" fill="#0f172a">주문 · 배송 건</text>
  <text x="465" y="357" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" font-weight="700" fill="#166534">관계</text><text x="465" y="405" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="19" fill="#0f172a">배송 건의 주문</text>
  <text x="740" y="357" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" font-weight="700" fill="#92400e">자료</text><text x="740" y="405" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="19" fill="#0f172a">출고 사건·시각</text>
  <text x="1012" y="357" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" font-weight="700" fill="#6d28d9">답의 한계</text><text x="1012" y="405" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="19" fill="#0f172a">자료 미확인 가능</text>
  <text x="600" y="536" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="20" fill="#475569">필요하지 않은 개념은 첫 범위에서 보류합니다.</text>
</svg>
