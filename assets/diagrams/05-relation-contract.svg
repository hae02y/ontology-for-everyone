<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">관계 계약서</title><desc id="desc">주문 O-391에서 배송 건 S-88로 이어지는 관계를 시작 대상, 동사, 끝 대상, 말하지 않는 것으로 나눈 그림</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="65" y="70" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#0f172a">관계를 한 문장으로 읽을 수 있어야 합니다</text>
  <rect x="65" y="178" width="270" height="205" rx="20" fill="#dbeafe"/><text x="200" y="235" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#1e40af">시작 대상 · 주문</text><text x="200" y="302" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="35" fill="#0f172a">O-391</text>
  <rect x="445" y="205" width="310" height="150" rx="20" fill="#fef3c7"/><text x="600" y="255" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#92400e">관계 · 주문의배송건</text><text x="600" y="308" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="21" fill="#0f172a">“연결된다”</text>
  <rect x="865" y="178" width="270" height="205" rx="20" fill="#dcfce7"/><text x="1000" y="235" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="21" font-weight="700" fill="#166534">끝 대상 · 배송 건</text><text x="1000" y="302" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="35" fill="#0f172a">S-88</text>
  <path d="M340 280H430M760 280H850" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="210" y="450" width="780" height="95" rx="19" fill="#fee2e2"/><text x="600" y="503" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" font-weight="700" fill="#991b1b">이 관계만으로 출고·도착·수령 완료를 알 수 없습니다.</text>
</svg>
