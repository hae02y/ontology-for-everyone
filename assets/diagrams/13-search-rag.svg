<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">온톨로지를 활용한 검색과 RAG</title><desc id="desc">고객 질문에서 대상 해석, 관계 조회, 정책 문서 검색, 근거 검증을 거쳐 답변 초안을 만드는 흐름</desc><rect width="1120" height="470" fill="#f8fafc"/><text x="45" y="52" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">답변 전, 대상과 근거를 따로 확인합니다</text><g font-family="sans-serif" text-anchor="middle"><rect x="50" y="140" width="190" height="140" rx="16" fill="#dbeafe"/><text x="145" y="192" font-size="20" font-weight="700" fill="#1e3a8a">고객 질문</text><text x="145" y="226" font-size="15" fill="#1e3a8a">“상자 하나만 반품?”</text><rect x="284" y="140" width="190" height="140" rx="16" fill="#e0e7ff"/><text x="379" y="192" font-size="20" font-weight="700" fill="#3730a3">대상 해석</text><text x="379" y="226" font-size="15" fill="#3730a3">상자·배송건·항목</text><rect x="518" y="140" width="190" height="140" rx="16" fill="#dcfce7"/><text x="613" y="192" font-size="20" font-weight="700" fill="#166534">관계 조회</text><text x="613" y="226" font-size="15" fill="#166534">주문→항목→배송</text><rect x="752" y="140" width="190" height="140" rx="16" fill="#fef3c7"/><text x="847" y="192" font-size="20" font-weight="700" fill="#92400e">정책 검색</text><text x="847" y="226" font-size="15" fill="#92400e">적용일·예외 확인</text><rect x="979" y="140" width="120" height="140" rx="16" fill="#fee2e2"/><text x="1039" y="192" font-size="19" font-weight="700" fill="#991b1b">답변</text><text x="1039" y="226" font-size="15" fill="#991b1b">근거 표시</text></g><path d="M244 210h32M478 210h32M712 210h32M946 210h25" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="560" y="370" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#334155">불확실한 대상은 확인 질문으로 돌려보냅니다</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs></svg>
