<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">에이전트의 의미 해석과 실행 권한 경계</title><desc id="desc">고객 요청을 온톨로지로 해석한 뒤 인증, 현재 상태, 정책, 승인, 원본 시스템 검사를 거쳐 실행하는 흐름</desc><rect width="1100" height="480" fill="#f8fafc"/><text x="40" y="51" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">뜻을 알았다고 바로 실행하지 않습니다</text><g font-family="sans-serif" text-anchor="middle"><rect x="42" y="135" width="185" height="134" rx="15" fill="#dbeafe"/><text x="135" y="187" font-size="20" font-weight="700" fill="#1e3a8a">고객 요청</text><text x="135" y="222" font-size="15" fill="#1e3a8a">“주소 바꿔 줘”</text><rect x="267" y="135" width="185" height="134" rx="15" fill="#e0e7ff"/><text x="360" y="187" font-size="20" font-weight="700" fill="#3730a3">온톨로지</text><text x="360" y="222" font-size="15" fill="#3730a3">어느 주소·배송건?</text><rect x="492" y="135" width="185" height="134" rx="15" fill="#fef3c7"/><text x="585" y="187" font-size="20" font-weight="700" fill="#92400e">권한·정책</text><text x="585" y="222" font-size="15" fill="#92400e">누가, 지금 가능한가?</text><rect x="717" y="135" width="155" height="134" rx="15" fill="#fde68a"/><text x="795" y="187" font-size="20" font-weight="700" fill="#92400e">승인</text><text x="795" y="222" font-size="15" fill="#92400e">대상·내용 확인</text><rect x="912" y="135" width="155" height="134" rx="15" fill="#dcfce7"/><text x="990" y="187" font-size="20" font-weight="700" fill="#166534">원본 실행</text><text x="990" y="222" font-size="15" fill="#166534">결과 재확인</text></g><path d="M230 201h29M455 201h29M680 201h29M875 201h29" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="550" y="355" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#334155">온톨로지는 의미를 설명하고, 실행 허가는 현재 권한과 정책이 결정합니다</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs></svg>
