<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">주문 상태의 출처와 시간 추적</title><desc id="desc">배송사 이벤트에서 수집, 상태 변환, 상담 답변으로 이어지는 흐름과 각 단계의 시간 및 버전 기록</desc>
  <rect width="1080" height="430" fill="#f8fafc"/>
  <text x="42" y="54" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">상태값 하나에도 이력이 있습니다</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="45" y="112" width="220" height="160" rx="18" fill="#dbeafe"/><text x="155" y="160" font-size="21" font-weight="700" fill="#1e3a8a">배송사 이벤트</text><text x="155" y="194" font-size="16" fill="#1e3a8a">사건 시각 · 이벤트 ID</text><text x="155" y="221" font-size="16" fill="#1e3a8a">원본 출처</text><rect x="309" y="112" width="220" height="160" rx="18" fill="#dcfce7"/><text x="419" y="160" font-size="21" font-weight="700" fill="#166534">수집과 변환</text><text x="419" y="194" font-size="16" fill="#166534">수집 시각</text><text x="419" y="221" font-size="16" fill="#166534">변환 규칙 버전</text><rect x="573" y="112" width="220" height="160" rx="18" fill="#fef3c7"/><text x="683" y="160" font-size="21" font-weight="700" fill="#92400e">상태 요약</text><text x="683" y="194" font-size="16" fill="#92400e">모델 버전</text><text x="683" y="221" font-size="16" fill="#92400e">사용한 이벤트</text><rect x="837" y="112" width="200" height="160" rx="18" fill="#ede9fe"/><text x="937" y="160" font-size="21" font-weight="700" fill="#5b21b6">상담 답변</text><text x="937" y="194" font-size="16" fill="#5b21b6">조회 시각</text><text x="937" y="221" font-size="16" fill="#5b21b6">승인·수정자</text></g>
  <path d="M270 190h34M534 190h34M798 190h34" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="540" y="339" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#334155">답변에서 원본까지 거꾸로 찾아갈 수 있어야 합니다</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
</svg>
