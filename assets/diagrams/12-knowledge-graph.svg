<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">원본 데이터에서 지식 그래프까지</title><desc id="desc">주문 표, 배송 파일, 반품 기록이 식별자와 관계 규칙을 거쳐 실제 주문 중심으로 연결된다</desc><rect width="1100" height="460" fill="#f8fafc"/>
  <text x="44" y="50" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">설계한 관계에 실제 기록을 채웁니다</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="55" y="100" width="250" height="56" rx="12" fill="#dbeafe"/><text x="180" y="137" font-size="19" fill="#1e3a8a">주문 표 · O-391</text><rect x="55" y="178" width="250" height="56" rx="12" fill="#dcfce7"/><text x="180" y="215" font-size="19" fill="#166534">배송 파일 · S-88</text><rect x="55" y="256" width="250" height="56" rx="12" fill="#fef3c7"/><text x="180" y="293" font-size="19" fill="#92400e">반품 기록 · R-17</text><rect x="405" y="159" width="265" height="104" rx="16" fill="#e0e7ff"/><text x="538" y="200" font-size="20" font-weight="700" fill="#3730a3">식별자·관계 규칙</text><text x="538" y="232" font-size="16" fill="#3730a3">범위 · 방향 · 갱신 시각</text><circle cx="835" cy="185" r="61" fill="#dbeafe"/><text x="835" y="190" font-size="18" fill="#1e3a8a">주문</text><circle cx="960" cy="315" r="61" fill="#dcfce7"/><text x="960" y="320" font-size="18" fill="#166534">배송건</text><circle cx="728" cy="315" r="61" fill="#fef3c7"/><text x="728" y="320" font-size="18" fill="#92400e">반품요청</text></g>
  <path d="M308 200h87M677 207h94M851 239l73 32M797 228l-42 34" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><text x="853" y="285" font-family="sans-serif" font-size="15" fill="#334155">연결</text><text x="655" y="259" font-family="sans-serif" font-size="15" fill="#334155">대상</text><text x="550" y="395" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#334155">연결 기준이 없으면 파일을 합쳐도 같은 업무 질문에 답할 수 없습니다</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
</svg>
