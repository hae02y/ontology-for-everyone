<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">반품 요청 데이터와 SHACL 조건의 검증</title><desc id="desc">반품 요청 R-17에 대상 주문 항목이 없는 경우 필수 관계 조건을 검사해 보류 보고서를 만든다.</desc>
<rect width="1200" height="600" rx="24" fill="#f8fafc"/><text x="60" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">SHACL: 정한 조건에 맞는지 검사한다</text>
<rect x="65" y="150" width="300" height="165" rx="18" fill="#dbeafe"/><text x="215" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">데이터 그래프</text><text x="215" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1e3a8a">반품 요청 R-17</text><text x="215" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1e3a8a">대상 주문 항목: 누락</text>
<rect x="450" y="150" width="300" height="165" rx="18" fill="#dcfce7"/><text x="600" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#14532d">모양 그래프</text><text x="600" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#14532d">모든 반품 요청은</text><text x="600" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#14532d">대상 항목 1개 이상</text>
<rect x="835" y="150" width="300" height="165" rx="18" fill="#fee2e2"/><text x="985" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">검증 보고서</text><text x="985" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#991b1b">R-17 조건 위반</text><text x="985" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#991b1b">접수 보류·원본 확인</text>
<path d="M365 232H450M750 232H835" stroke="#64748b" stroke-width="5"/><rect x="160" y="390" width="880" height="100" rx="18" fill="#fef3c7"/><text x="600" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#92400e">검증 통과 ≠ 현실의 사건이 사실이라는 보증</text><text x="600" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#92400e">전체 접수 건수와 실제 검사 대상 건수도 함께 확인</text>
<text x="60" y="555" font-family="Arial,sans-serif" font-size="17" fill="#475569">가상의 반품 접수 · 저자 제작 개념도</text>
</svg>
