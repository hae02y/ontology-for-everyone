<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">클래스와 개별 기록 구분</title><desc id="desc">주문과 배송 건은 종류이고 O-391 및 S-88은 그 종류의 개별 기록이라는 그림</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="65" y="70" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#0f172a">종류와 한 건을 다른 층에 놓습니다</text>
  <text x="65" y="145" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#475569">종류: 모델이 설명하는 대상</text>
  <rect x="170" y="175" width="330" height="105" rx="20" fill="#dbeafe"/><rect x="700" y="175" width="330" height="105" rx="20" fill="#dcfce7"/><text x="335" y="241" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="29" font-weight="700" fill="#1e40af">주문</text><text x="865" y="241" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="29" font-weight="700" fill="#166534">배송 건</text>
  <text x="65" y="350" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="20" font-weight="700" fill="#475569">개별: 실제 한 건의 기록</text>
  <path d="M335 282V390M865 282V390" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="170" y="405" width="330" height="112" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><rect x="700" y="405" width="330" height="112" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/><text x="335" y="453" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#1e40af">O-391</text><text x="335" y="486" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="17" fill="#334155">가상의 주문 한 건</text><text x="865" y="453" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="700" fill="#166534">S-88</text><text x="865" y="486" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="17" fill="#334155">가상의 배송 한 건</text>
  <path d="M503 461H688" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><text x="595" y="443" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="17" fill="#475569">연결</text>
  <text x="600" y="580" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="19" fill="#475569">종류의 관계가 개별 건의 실제 사실을 자동으로 보증하지 않습니다.</text>
</svg>
