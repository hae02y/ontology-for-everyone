<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">온톨로지를 구성하는 네 층</title><desc id="desc">용어, 대상의 종류, 관계, 의미 경계를 차례로 쌓는 그림</desc>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="65" y="70" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="700" fill="#0f172a">온톨로지는 이름 목록에서 멈추지 않습니다</text>
  <rect x="95" y="452" width="1010" height="100" rx="18" fill="#dbeafe"/><text x="130" y="512" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="25" font-weight="700" fill="#1e40af">1  용어</text><text x="360" y="512" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" fill="#1e293b">주문 · 배송 건 · 반품 요청</text>
  <rect x="160" y="342" width="880" height="94" rx="18" fill="#dcfce7"/><text x="195" y="398" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="25" font-weight="700" fill="#166534">2  종류</text><text x="425" y="398" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" fill="#1e293b">주문과 배송 건은 다른 대상</text>
  <rect x="225" y="232" width="750" height="94" rx="18" fill="#fef3c7"/><text x="260" y="289" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="25" font-weight="700" fill="#92400e">3  관계</text><text x="490" y="289" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="23" fill="#1e293b">주문에 배송 건이 연결됨</text>
  <rect x="290" y="122" width="620" height="94" rx="18" fill="#ede9fe"/><text x="325" y="179" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="25" font-weight="700" fill="#6d28d9">4  의미 경계</text><text x="575" y="179" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="20" fill="#1e293b">연결 ≠ 배송 완료</text>
  <text x="600" y="594" text-anchor="middle" font-family="Noto Sans KR,Apple SD Gothic Neo,sans-serif" font-size="17" fill="#64748b">개별 주문의 실제 상태는 운영 기록을 별도로 확인합니다.</text>
</svg>
