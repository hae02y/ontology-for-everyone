<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">다온상점 반품 요청의 관계와 검증</title><desc id="desc">반품 요청 R-17에서 주문 항목 OI-391-2, 주문 O-391, 배송건 S-89로 이어지고 R-18은 대상 항목이 없어 검증 실패</desc><rect width="1200" height="560" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">반품 요청에서 정확한 배송건까지</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="165" width="215" height="125" rx="18" fill="#fee2e2"/><text x="152" y="220" font-size="24" fill="#991b1b">R-17</text><text x="152" y="255" font-size="17" fill="#991b1b">반품 요청</text><rect x="345" y="165" width="215" height="125" rx="18" fill="#fef3c7"/><text x="452" y="220" font-size="24" fill="#92400e">OI-391-2</text><text x="452" y="255" font-size="17" fill="#92400e">주문 항목</text><rect x="645" y="165" width="215" height="125" rx="18" fill="#dbeafe"/><text x="752" y="220" font-size="24" fill="#1e3a8a">O-391</text><text x="752" y="255" font-size="17" fill="#1e3a8a">주문</text><rect x="945" y="165" width="215" height="125" rx="18" fill="#dcfce7"/><text x="1052" y="220" font-size="24" fill="#166534">S-89</text><text x="1052" y="255" font-size="17" fill="#166534">배송건</text></g><g stroke="#64748b" stroke-width="5" fill="none"><path d="M260 228h85M560 228h85"/><path d="M452 300v65h600v-75" stroke-dasharray="9 7"/></g><g font-family="sans-serif" text-anchor="middle" font-size="17" fill="#334155"><text x="303" y="205">대상</text><text x="602" y="205">속함</text><text x="752" y="352">항목이 S-89에 담김</text></g><rect x="265" y="410" width="670" height="85" rx="16" fill="#e2e8f0"/><text x="600" y="445" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">SHACL 검사: R-17 통과 · 대상 항목이 없는 R-18 위반</text><text x="600" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">구조 검사는 환불 완료나 실행 권한을 증명하지 않습니다.</text></svg>
