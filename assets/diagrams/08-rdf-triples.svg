<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">세 개의 RDF 트리플이 만든 주문 그래프</title><desc id="desc">주문은 주문 항목을 포함하고 주문 항목은 배송과 반품 요청에 연결된다. 각각의 선은 뜻이 있는 술어이다.</desc>
<rect width="1200" height="590" rx="24" fill="#f8fafc"/><text x="60" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">RDF: 대상 — 관계 — 대상</text>
<rect x="65" y="180" width="205" height="110" rx="18" fill="#dbeafe"/><text x="167" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#1e3a8a">주문</text><text x="167" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#1e3a8a">O-391</text>
<rect x="475" y="180" width="230" height="110" rx="18" fill="#dcfce7"/><text x="590" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#14532d">주문 항목</text><text x="590" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#14532d">OI-391-2</text>
<rect x="915" y="100" width="220" height="105" rx="18" fill="#e0e7ff"/><text x="1025" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#3730a3">배송</text><text x="1025" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#3730a3">S-88</text>
<rect x="915" y="350" width="220" height="105" rx="18" fill="#fef3c7"/><text x="1025" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#92400e">반품 요청</text><text x="1025" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#92400e">R-17</text>
<path d="M270 235H475M705 215L915 155M915 400L705 258" fill="none" stroke="#64748b" stroke-width="5"/><text x="370" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">포함함</text><text x="810" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">배송됨</text><text x="810" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#334155">대상임</text>
<rect x="65" y="380" width="640" height="95" rx="16" fill="#e2e8f0"/><text x="90" y="420" font-family="Arial,sans-serif" font-size="21" fill="#0f172a">질문: 반품 요청과 연결된 배송은?</text><text x="90" y="453" font-family="Arial,sans-serif" font-size="17" fill="#334155">반품 요청 → 주문 항목 → 배송 경로를 확인</text>
<text x="60" y="548" font-family="Arial,sans-serif" font-size="17" fill="#475569">가상의 주문 기록 · 저자 제작 개념도</text>
</svg>
