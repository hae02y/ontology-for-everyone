<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">고객 표현에서 반품 요청 개념으로</title><desc id="desc">여러 고객 표현이 같은 후보 개념으로 이어지되 반품 요청과 환불 요청은 분리되고 상태는 별도 속성으로 기록된다.</desc>
<rect width="1200" height="560" rx="24" fill="#f8fafc"/><text x="60" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">이름을 모으기 전에 개념의 경계를 정한다</text>
<rect x="60" y="130" width="250" height="90" rx="16" fill="#dbeafe"/><text x="185" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">“물건 돌려보내기”</text>
<rect x="60" y="255" width="250" height="90" rx="16" fill="#dbeafe"/><text x="185" y="309" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">“반품 신청”</text>
<rect x="405" y="190" width="330" height="115" rx="18" fill="#dcfce7"/><text x="570" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#14532d">반품 요청</text><text x="570" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#166534">고정된 개념 ID: return-request</text>
<rect x="845" y="130" width="285" height="90" rx="16" fill="#fef3c7"/><text x="988" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#92400e">대상: 주문 항목</text>
<rect x="845" y="265" width="285" height="90" rx="16" fill="#e0e7ff"/><text x="988" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#3730a3">상태: 승인 대기</text>
<rect x="405" y="390" width="330" height="90" rx="16" fill="#fee2e2"/><text x="570" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#991b1b">다른 개념: 환불 요청</text>
<path d="M310 175L405 220M310 300L405 270M735 235L845 175M735 265L845 310" stroke="#64748b" stroke-width="4" fill="none"/><path d="M570 305V390" stroke="#ef4444" stroke-width="4" stroke-dasharray="9 8"/><text x="600" y="365" font-family="Arial,sans-serif" font-size="17" fill="#991b1b">같은 뜻 아님</text>
<text x="60" y="527" font-family="Arial,sans-serif" font-size="17" fill="#475569">가상의 고객지원 예시 · 저자 제작 개념도</text>
</svg>
