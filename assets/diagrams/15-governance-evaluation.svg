<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc"><title id="title">온톨로지의 운영과 평가 순환</title><desc id="desc">업무 변경 제안이 정의 검토, 승인, 모델·데이터 적용, 질문 평가, 오류 수정을 거쳐 다시 제안으로 연결된다</desc><rect width="1100" height="490" fill="#f8fafc"/><text x="45" y="54" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">모델의 품질은 변경과 검증을 반복할 때 유지됩니다</text><g font-family="sans-serif" text-anchor="middle"><rect x="64" y="165" width="180" height="120" rx="16" fill="#dbeafe"/><text x="154" y="210" font-size="20" font-weight="700" fill="#1e3a8a">변경 제안</text><text x="154" y="242" font-size="15" fill="#1e3a8a">이유·영향 질문</text><rect x="278" y="165" width="180" height="120" rx="16" fill="#e0e7ff"/><text x="368" y="210" font-size="20" font-weight="700" fill="#3730a3">정의 검토</text><text x="368" y="242" font-size="15" fill="#3730a3">업무 책임자</text><rect x="492" y="165" width="180" height="120" rx="16" fill="#fef3c7"/><text x="582" y="210" font-size="20" font-weight="700" fill="#92400e">승인·적용</text><text x="582" y="242" font-size="15" fill="#92400e">모델·원본 버전</text><rect x="706" y="165" width="180" height="120" rx="16" fill="#dcfce7"/><text x="796" y="210" font-size="20" font-weight="700" fill="#166534">질문 평가</text><text x="796" y="242" font-size="15" fill="#166534">정상·예외·권한</text><rect x="920" y="165" width="135" height="120" rx="16" fill="#fee2e2"/><text x="987" y="210" font-size="20" font-weight="700" fill="#991b1b">오류 수정</text><text x="987" y="242" font-size="15" fill="#991b1b">근거·영향</text></g><path d="M247 225h22M461 225h22M675 225h22M889 225h22" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M984 293Q550 440 155 293" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="9 8"/><text x="550" y="414" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#334155">현장에서 찾은 오류를 다음 모델 개정에 반영합니다</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs></svg>
