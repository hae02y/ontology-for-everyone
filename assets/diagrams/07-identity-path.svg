<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">서로 다른 시스템의 ID를 연결하는 근거</title><desc id="desc">고객 계정에서 주문과 주문 항목, 배송으로 이어지는 확인된 관계와 이름만 비슷한 불확실한 후보 관계를 구분한다.</desc>
<rect width="1200" height="570" rx="24" fill="#f8fafc"/><text x="55" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">같은 문자열보다 연결 근거가 중요하다</text>
<rect x="60" y="150" width="220" height="105" rx="18" fill="#dbeafe"/><text x="170" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">고객 계정</text><text x="170" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1e3a8a">C-204</text>
<rect x="345" y="150" width="220" height="105" rx="18" fill="#dcfce7"/><text x="455" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#14532d">주문</text><text x="455" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#14532d">O-391</text>
<rect x="630" y="150" width="220" height="105" rx="18" fill="#fef3c7"/><text x="740" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#92400e">주문 항목</text><text x="740" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#92400e">OI-391-2</text>
<rect x="915" y="150" width="220" height="105" rx="18" fill="#e0e7ff"/><text x="1025" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#3730a3">배송</text><text x="1025" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#3730a3">S-88</text>
<path d="M280 202H345M565 202H630M850 202H915" stroke="#0f766e" stroke-width="5"/><text x="300" y="125" font-family="Arial,sans-serif" font-size="16" fill="#0f766e">원본 ID로 확인한 연결</text>
<rect x="345" y="360" width="220" height="100" rx="18" fill="#fee2e2"/><text x="455" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#991b1b">상담 기록</text><text x="455" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#991b1b">“J. Lee”</text>
<path d="M455 255V360" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8"/><text x="475" y="323" font-family="Arial,sans-serif" font-size="17" fill="#991b1b">이름만으로는 후보</text>
<text x="60" y="530" font-family="Arial,sans-serif" font-size="17" fill="#475569">가상의 식별자 · 저자 제작 개념도</text>
</svg>
