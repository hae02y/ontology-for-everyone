<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">온톨로지 설계표 완성 흐름</title><desc id="desc">업무 질문을 정하고 용어와 관계, 실제 데이터, 검증, 출처와 권한을 차례로 정리하는 실습</desc><rect width="1200" height="540" fill="#f8fafc"/><text x="600" y="58" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">한 장의 설계표로 끝내는 실습</text><g font-family="sans-serif" text-anchor="middle"><rect x="50" y="155" width="200" height="120" rx="16" fill="#dbeafe"/><text x="150" y="207" font-size="23" fill="#1e3a8a">업무 질문</text><text x="150" y="243" font-size="17" fill="#1e3a8a">무엇에 답하나</text><rect x="275" y="155" width="200" height="120" rx="16" fill="#dcfce7"/><text x="375" y="207" font-size="23" fill="#166534">용어·관계</text><text x="375" y="243" font-size="17" fill="#166534">뜻과 방향</text><rect x="500" y="155" width="200" height="120" rx="16" fill="#fef3c7"/><text x="600" y="207" font-size="23" fill="#92400e">사실·식별자</text><text x="600" y="243" font-size="17" fill="#92400e">원본과 연결</text><rect x="725" y="155" width="200" height="120" rx="16" fill="#ede9fe"/><text x="825" y="207" font-size="23" fill="#5b21b6">검증·출처</text><text x="825" y="243" font-size="17" fill="#5b21b6">조건과 시각</text><rect x="950" y="155" width="200" height="120" rx="16" fill="#fee2e2"/><text x="1050" y="207" font-size="23" fill="#991b1b">운영·평가</text><text x="1050" y="243" font-size="17" fill="#991b1b">책임과 시험</text></g><g stroke="#64748b" stroke-width="5"><path d="M250 215h25M475 215h25M700 215h25M925 215h25"/></g><rect x="130" y="345" width="940" height="95" rx="16" fill="#e2e8f0"/><text x="600" y="382" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#0f172a">검토: 업무 담당자 · 데이터 담당자 · 보안 담당자</text><text x="600" y="414" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">불확실한 항목은 미결정으로 남기고 다음 검토일을 정합니다.</text></svg>
