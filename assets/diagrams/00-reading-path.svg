<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">온톨로지 책의 학습 경로</title><desc id="desc">업무 질문에서 용어, 개념과 관계, 사실과 검증, AI 활용, 최종 설계표로 이어지는 단계</desc><rect width="1200" height="480" fill="#f8fafc"/><text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0f172a">업무의 말을 함께 정의하는 다섯 단계</text><g font-family="sans-serif" text-anchor="middle"><rect x="40" y="170" width="200" height="130" rx="18" fill="#dbeafe"/><text x="140" y="224" font-size="24" fill="#1e3a8a">업무 질문</text><text x="140" y="260" font-size="17" fill="#1e3a8a">무엇을 답할까?</text><rect x="270" y="170" width="200" height="130" rx="18" fill="#dcfce7"/><text x="370" y="224" font-size="24" fill="#166534">용어</text><text x="370" y="260" font-size="17" fill="#166534">무슨 뜻일까?</text><rect x="500" y="170" width="200" height="130" rx="18" fill="#fef3c7"/><text x="600" y="224" font-size="23" fill="#92400e">개념·관계</text><text x="600" y="260" font-size="17" fill="#92400e">어떻게 연결할까?</text><rect x="730" y="170" width="200" height="130" rx="18" fill="#ede9fe"/><text x="830" y="224" font-size="24" fill="#5b21b6">사실·검증</text><text x="830" y="260" font-size="17" fill="#5b21b6">근거가 맞을까?</text><rect x="960" y="170" width="200" height="130" rx="18" fill="#fee2e2"/><text x="1060" y="224" font-size="24" fill="#991b1b">설계표</text><text x="1060" y="260" font-size="17" fill="#991b1b">누가 관리할까?</text></g><g fill="none" stroke="#64748b" stroke-width="5"><path d="M240 235h30M470 235h30M700 235h30M930 235h30"/></g><text x="600" y="390" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">AI 활용은 정의·데이터·출처·권한을 함께 점검한 뒤 평가합니다.</text></svg>
